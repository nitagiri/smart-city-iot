
services:
  sensor-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    networks:
      sensors:
        ipv4_address: 10.10.1.10

  api-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    networks:
      api_network:
        ipv4_address: 10.10.2.10

  spark-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    networks:
      spark_network:
        ipv4_address: 10.10.3.10

  router:
    build:
      context: ./network/router
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      sensors:
        ipv4_address: 10.10.1.254
      api_network:
        ipv4_address: 10.10.2.254
      spark_network:
        ipv4_address: 10.10.3.254

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      database_network:


  api:
    build:
      context: ./api
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      SENSOR_API_KEY: ${SENSOR_API_KEY:?Set SENSOR_API_KEY in .env}

    volumes:
      - ./security/certs:/certs:ro

    networks:
      api_network:
        ipv4_address: 10.10.2.2
      database_network:



networks:
  sensors:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24

  api_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24

  spark_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.3.0/24

  database_network:
    driver: bridge

volumes:
  mongodb_data:
