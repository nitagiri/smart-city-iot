
services:
  sensor-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    networks:
      sensors:
        ipv4_address: 10.10.1.10

  api-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    networks:
      api_network:
        ipv4_address: 10.10.2.10

  spark-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    networks:
      spark_network:
        ipv4_address: 10.10.3.10


  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SENSOR_API_KEY: ${SENSOR_API_KEY:?Set SENSOR_API_KEY in .env}
      API_URL: https://10.10.2.2:8000/readings?limit=10000
      API_CERT_FILE: /certs/server.crt
    volumes:
      - ./security/certs:/certs:ro
    networks:
      - api_network


  router:
    build:
      context: ./network/router
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      sensors:
        ipv4_address: 10.10.1.254
      api_network:
        ipv4_address: 10.10.2.254
      spark_network:
        ipv4_address: 10.10.3.254

  mongodb:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      database_network:


  api:
    build:
      context: ./api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    cap_add:
      - NET_ADMIN

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      SENSOR_API_KEY: ${SENSOR_API_KEY:?Set SENSOR_API_KEY in .env}

    volumes:
      - ./security/certs:/certs:ro

    networks:
      api_network:
        ipv4_address: 10.10.2.2
      database_network:



  spark-master:
    image: apache/spark:3.5.3
    hostname: spark-master
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080

    environment:
      SENSOR_API_KEY: ${SENSOR_API_KEY:?Set SENSOR_API_KEY in .env}
      PYSPARK_PYTHON: python3

    volumes:
      - ./spark:/opt/spark/jobs:ro
      - ./security/certs:/certs:ro

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      spark_network:
        ipv4_address: 10.10.3.20
    restart: unless-stopped

  spark-worker-1:
    image: apache/spark:3.5.3
    hostname: spark-worker-1
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 1
      --memory 1g
    depends_on:
      - spark-master
    networks:
      spark_network:
        ipv4_address: 10.10.3.21
    restart: unless-stopped

  spark-worker-2:
    image: apache/spark:3.5.3
    hostname: spark-worker-2
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 1
      --memory 1g
    depends_on:
      - spark-master
    networks:
      spark_network:
        ipv4_address: 10.10.3.22
    restart: unless-stopped


networks:
  sensors:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24

  api_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24

  spark_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.3.0/24

  database_network:
    driver: bridge

volumes:
  mongodb_data:
